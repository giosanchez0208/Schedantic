[project]
name = "stlm"
version = "0.1.0"
description = "Schedule Tiny Language Model - NL to jCal via an intermediate representation"
requires-python = ">=3.11"
dependencies = [
    "python-dateutil>=2.9.0",
    "icalendar>=6.0.0",
    "torch>=2.13.0",
    "numpy>=2.4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stlm"]
